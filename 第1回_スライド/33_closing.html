<style>body { counter-reset: page 32; }
body { font-family: 'Noto Sans JP', 'Yu Gothic', Meiryo, Arial, sans-serif; color: #1E292E; }

section { counter-increment: page; background: #F7F8F6; padding: 128px 128px 160px; display: flex; flex-direction: column; gap: 20px; }
section.cover, section.closing { background: #16343A; color: #EEF3F1; padding: 128px; justify-content: center; gap: 36px; }

/* 見出しまわり */
.eyebrow { align-self: flex-start; font-size: 24px; font-weight: 700; color: #FBFBF8; background: #4A5A61; padding: 6px 22px; border-radius: 40px; }
.l1 .eyebrow { background: #0F6E64; }

.lead { font-size: 28px; font-weight: 700; color: #4A5A61; line-height: 1.45; }

.row { display: flex; flex-direction: row; gap: 32px; align-items: stretch; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.f2 { flex: 2; }
.f3 { flex: 3; }

/* 本文 */
.pts { font-size: 24px; line-height: 1.5; color: #1E292E; padding-left: 1.1em; }
.txt { font-size: 24px; line-height: 1.5; color: #1E292E; }

.tbl { font-size: 24px; color: #1E292E; width: 100%; }

.tbl.lg td, .tbl.lg th { padding-top: .5em; padding-bottom: .5em; }

.hd { background: #4A5A61; }
.hd1 { background: #0F6E64; }
.hd2 { background: #A8530F; }
.ra { background: #FDFDFB; }
.r1 { background: #E1F0ED; }
.r2 { background: #FBEADB; }

/* 図 */
.arr { width: 64px; height: 34px; background: #8A979C; align-self: center; flex: none; }

.flowbox .txt { text-align: center; }

.grid2 { display: grid; grid-template-columns: 220px 1fr 1fr; grid-template-rows: 64px 1fr 1fr; gap: 16px; flex: 1; }
.gh { background: #4A5A61; border-radius: 14px; display: flex; align-items: center; justify-content: center; }

.kicker { font-size: 30px; font-weight: 700; color: #9CC9C1; }

.closing .txt { font-size: 32px; color: #D6E6E3; }

.closing .card .txt { font-size: 28px; color: #EEF3F1; }
